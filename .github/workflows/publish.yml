name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      title: ${{ steps.info.outputs.title }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      previous-tag: ${{ steps.info.outputs.previous-tag }}
      run-id: ${{ steps.build.outputs.run-id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate ref is a tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::This workflow must be run on a tag, but was run on $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gather release info
        id: info
        run: |
          version="$GITHUB_REF_NAME"

          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Tag $version does not match the version in src-tauri/Cargo.toml ($cargo_version)."
            exit 1
          fi

          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for $version already exists."
            exit 1
          fi

          title="OpenFusionLauncher v$version"

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          # Stable releases compare against the previous stable release; prereleases against the previous tag of any kind.
          previous_tag=$(git -c versionsort.suffix=- tag --list --sort=-v:refname \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            | awk -v v="$version" -v pre="$prerelease" \
                'found && (pre == "true" || index($0, "-") == 0) { print; exit } $0 == v { found = 1 }')

          {
            echo "version=$version"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "previous-tag=$previous_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $version"
          echo "Title: $title"
          echo "Prerelease: $prerelease"
          echo "Previous tag: ${previous_tag:-<none>}"

      # The tag may be pushed alongside the commit, so wait for its build on main to finish.
      - name: Find build run on main
        id: build
        timeout-minutes: 120
        run: |
          sha=$(git rev-parse HEAD)
          start=$SECONDS
          while true; do
            runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/rust.yml/runs" \
              -f branch=main -f event=push -f head_sha="$sha" --jq '.workflow_runs')
            run_id=$(jq -r 'map(select(.conclusion == "success")) | sort_by(.run_number) | last | .id // empty' <<< "$runs")
            [[ -n "$run_id" ]] && break

            pending=$(jq 'map(select(.status != "completed")) | length' <<< "$runs")
            total=$(jq 'length' <<< "$runs")
            # Allow a grace period for the build run to be created when the commit was pushed at the same time.
            if [[ "$pending" -eq 0 && ( "$total" -gt 0 || $((SECONDS - start)) -ge 300 ) ]]; then
              echo "::error::No successful build on main found for $sha ($GITHUB_REF_NAME)."
              exit 1
            fi

            echo "Waiting for build on main for $sha ($pending pending, $total total)..."
            sleep 60
          done
          echo "Using build run $run_id: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  sign-windows:
    needs: prepare
    runs-on: windows-latest
    environment: Production
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Windows Standalone Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-windows-standalone
          path: windows-standalone
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download Windows Installer Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-windows-installer
          path: windows-installer
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.SIGNING_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGNING_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SIGNING_AZURE_SUBSCRIPTION_ID }}

      - name: Sign Standalone Executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openfusion-codesigning
          certificate-profile-name: openfusion-signing
          files-folder: windows-standalone
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Sign Installer Executables
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: openfusion-codesigning
          certificate-profile-name: openfusion-signing
          files-folder: windows-installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-windows-standalone-signed
          path: windows-standalone/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-windows-installer-signed
          path: windows-installer/

  sign-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Download macOS Universal Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-macos-universal
          path: macos-universal
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Import signing certificate
        id: certs
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.SIGNING_APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.SIGNING_APPLE_CERTIFICATE_PASSWORD }}

      - name: Select signing identity
        env:
          IDENTITIES: ${{ steps.certs.outputs.identities }}
        run: |
          identity=$(jq -r 'first(.[] | select(.name | startswith("Developer ID Application:")) | .hash) // empty' <<< "$IDENTITIES")
          if [[ -z "$identity" ]]; then
            echo "::error::No Developer ID Application identity found in the imported certificate."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Artifacts don't preserve file permissions, so restore the executable bit.
      - name: Prepare app
        run: |
          chmod +x macos-universal/OpenFusionLauncher.app/Contents/MacOS/*
          echo "APP_PATH=macos-universal/OpenFusionLauncher.app" >> "$GITHUB_ENV"

      - name: Sign app
        run: |
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple app
        env:
          NOTARY_KEY: ${{ secrets.SIGNING_APPLE_API_KEY }}
          NOTARY_KEY_ID: ${{ secrets.SIGNING_APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.SIGNING_APPLE_API_ISSUER }}
        run: |
          key_path="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$NOTARY_KEY" > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          auth=(--key "$key_path" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER")

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/app.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/app.zip" "${auth[@]}" --wait --output-format json) || true
          echo "$result"
          if [[ "$(jq -r '.status // empty' <<< "$result")" != "Accepted" ]]; then
            id=$(jq -r '.id // empty' <<< "$result")
            [[ -n "$id" ]] && xcrun notarytool log "$id" "${auth[@]}"
            echo "::error::Notarization failed."
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Create updater archive
        run: |
          mkdir signed
          COPYFILE_DISABLE=1 tar -czf signed/OpenFusionLauncher.app.tar.gz -C "$(dirname "$APP_PATH")" OpenFusionLauncher.app

      # Mirrors what `cargo tauri build --bundles dmg` produces on CI.
      - name: Create DMG
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          brew install create-dmg
          mkdir dmg-src
          mv "$APP_PATH" dmg-src/
          create-dmg \
            --volname OpenFusionLauncher \
            --volicon dmg-src/OpenFusionLauncher.app/Contents/Resources/icon.icns \
            --window-size 660 400 \
            --icon OpenFusionLauncher.app 180 170 \
            --hide-extension OpenFusionLauncher.app \
            --app-drop-link 480 170 \
            --skip-jenkins \
            "signed/OpenFusionLauncher_${VERSION}_universal.dmg" \
            dmg-src/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-macos-universal-signed
          path: signed/

  sign-linux:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      SIGNING_KEY_FINGERPRINT: F3B67263686214EFB01C9578AA4F216D87E7E919
    steps:
      - name: Download Linux AppImage Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-linux-appimage
          path: linux-appimage
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Import signing key
        env:
          SIGNING_LINUX_PRIVATE_KEY: ${{ secrets.SIGNING_LINUX_PRIVATE_KEY }}
        run: base64 -d <<< "$SIGNING_LINUX_PRIVATE_KEY" | gpg --batch --import

      # Per the AppImage spec, .sha256_sig holds a detached signature of the hex SHA-256 digest of the
      # unsigned AppImage, and .sig_key holds the public key.
      - name: Sign AppImage
        run: |
          appimage=$(realpath linux-appimage/*.AppImage)
          chmod +x "$appimage"

          sha256sum "$appimage" | cut -d' ' -f1 | tr -d '\n' > "$RUNNER_TEMP/digest"
          gpg --batch --local-user "$SIGNING_KEY_FINGERPRINT" --armor --textmode --detach-sign \
            --output "$RUNNER_TEMP/appimage.sig" "$RUNNER_TEMP/digest"
          "$appimage" --appimage-addsign "$RUNNER_TEMP/appimage.sig"

          # The runtime has no option for embedding the key, so write it into the section directly.
          key_offset=$(readelf -SW "$appimage" | awk '$2 == ".sig_key" { print $5 }')
          gpg --batch --armor --export --export-options export-minimal "$SIGNING_KEY_FINGERPRINT" \
            | dd of="$appimage" bs=1 seek=$((16#$key_offset)) conv=notrunc status=none

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-linux-appimage-signed
          path: linux-appimage/

  release:
    needs: [prepare, sign-windows, sign-macos, sign-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TITLE: ${{ needs.prepare.outputs.title }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous-tag }}
    steps:
      - name: Download Linux Standalone Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-linux-standalone
          path: artifacts/linux-standalone
          run-id: ${{ needs.prepare.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download Signed Linux AppImage Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-linux-appimage-signed
          path: artifacts/linux-appimage

      - name: Download Signed macOS Universal Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-macos-universal-signed
          path: artifacts/macos-universal

      - name: Download Signed Windows Standalone Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-windows-standalone-signed
          path: artifacts/windows-standalone

      - name: Download Signed Windows Installer Artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: openfusionlauncher-windows-installer-signed
          path: artifacts/windows-installer

      - name: Package
        run: |
          single() {
            local matches=("$@")
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "::error::Expected exactly one file matching the pattern, found: ${matches[*]}" >&2
              exit 1
            fi
            echo "${matches[0]}"
          }

          appimage=$(single artifacts/linux-appimage/*.AppImage)
          dmg=$(single artifacts/macos-universal/*.dmg)
          app_archive=$(single artifacts/macos-universal/*.app.tar.gz)
          installer=$(single artifacts/windows-installer/*-setup.exe)

          mkdir release

          chmod +x artifacts/linux-standalone/openfusionlauncher
          (cd artifacts/linux-standalone && zip -r -X -D ../../release/OpenFusionLauncher-Linux.zip .)
          install -m 755 "$appimage" release/OpenFusionLauncher.AppImage

          cp "$dmg" release/OpenFusionLauncher-MacOS-Universal.dmg
          cp "$app_archive" release/OpenFusionLauncher-MacOS-Universal.app.tar.gz

          (cd artifacts/windows-standalone && zip -r -X -D ../../release/OpenFusionLauncher-Windows-Portable.zip .)
          cp "$installer" release/OpenFusionLauncher-Windows-Installer.exe

          ls -l release

      - name: Sign updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.SIGNING_TAURI_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir updater-sigs
          for file in OpenFusionLauncher.AppImage OpenFusionLauncher-Windows-Installer.exe OpenFusionLauncher-MacOS-Universal.app.tar.gz; do
            npx --yes @tauri-apps/cli@2 signer sign "release/$file"
            mv "release/$file.sig" updater-sigs/
          done

      - name: Create updater manifest
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$VERSION"
          platform() {
            jq -n --rawfile signature "updater-sigs/$1.sig" --arg url "$url/$1" '{signature: $signature, url: $url}'
          }

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson linux "$(platform OpenFusionLauncher.AppImage)" \
            --argjson windows "$(platform OpenFusionLauncher-Windows-Installer.exe)" \
            --argjson macos "$(platform OpenFusionLauncher-MacOS-Universal.app.tar.gz)" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": $linux,
                "windows-x86_64": $windows,
                "darwin-x86_64": $macos,
                "darwin-aarch64": $macos
              }
            }' > release/latest.json

          cat release/latest.json

      - name: Create draft release
        run: |
          {
            echo "We're announcing the release of OpenFusionLauncher v$VERSION."
            echo
            echo "This update brings the following changes:"
            echo
            echo "- TODO"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "**Full Changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$VERSION"
            fi
          } > notes.md

          args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$TITLE" \
            --notes-file notes.md \
            "${args[@]}"
