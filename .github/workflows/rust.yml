name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  WEBPLAYER_DLL_VERSION: patched-20261029

jobs:
  build-ffrunner:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ffrunner-version.outputs.version }}
    steps:
    - name: Install dependencies
      run: |
        sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        sudo apt update && sudo apt install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 wget

    - uses: actions/checkout@v7
      with:
       submodules: 'recursive'

    - name: Stamp ffrunner version
      id: ffrunner-version
      working-directory: resources/ffrunner
      run: |
        version=$(git rev-parse --short HEAD)
        echo "FFRUNNER_VERSION=$version" >> "$GITHUB_ENV"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Build 
      run: make -C resources/ffrunner

    - name: Download webplayer and Vulkan DLLs
      working-directory: resources/ffrunner
      run: ./bootstrap-dlls.sh ${{ env.WEBPLAYER_DLL_VERSION }}

    - name: Upload ffrunner
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ffrunner-mingw
        path: resources/ffrunner/

  build-linux-standalone:
    needs: build-ffrunner
    # The standalone binary links against the build host's glibc, so this runner image should
    # stay old to keep it compatible with older distros.
    runs-on: ubuntu-22.04
    env:
      FFRUNNER_VERSION: ${{ needs.build-ffrunner.outputs.version }}
    steps:
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*

    - name: Install dependencies
      run: |
        sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
        sudo apt update && sudo apt install -y \
          libwebkit2gtk-4.1-dev \
          build-essential \
          curl \
          wget \
          file \
          libxdo-dev \
          libssl-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev

    - name: Restore Tauri CLI
      id: cache-tauri
      uses: actions/cache@v6
      with:
        path: /home/runner/.cargo
        key: tauri-cli-Linux

    - name: Install Tauri CLI
      if: steps.cache-tauri.outputs.cache-hit != 'true'
      run: cargo install tauri-cli --version "^2.0.0" --locked

    - uses: actions/checkout@v7

    - name: Download ffrunner
      uses: actions/download-artifact@v8.0.2
      with:
        name: ffrunner-mingw
        path: resources/ffrunner

    - name: Install NPM packages
      run: npm install

    # - name: Restore Cargo dependencies
    #   id: cache-cargo
    #   uses: actions/cache@v6
    #   with:
    #     path: |
    #       src-tauri/target/release/deps
    #       src-tauri/target/release/.fingerprint
    #       src-tauri/target/release/incremental
    #     key: cargo-deps-Linux

    - name: Build
      run: cargo tauri build

    - name: Package
      run: |
        cd src-tauri/target/release
        mkdir linux-standalone
        cp -r -t linux-standalone openfusionlauncher ffrunner.exe ffrunner64.exe d3d9_vulkan.dll d3d9_vulkan64.dll assets defaults loader loader-x64 player mono

    - uses: actions/upload-artifact@v7.0.2
      with:
        name: openfusionlauncher-linux-standalone
        path: src-tauri/target/release/linux-standalone/

  build-linux-appimage:
    needs: build-ffrunner
    # The new AppImage format bundles the build host's libraries (including glibc and Mesa), so it
    # needs a host with a recent Mesa; Ubuntu's is too old for hardware acceleration on NVIDIA + Wayland.
    # See https://github.com/tauri-apps/tauri/pull/12491#issuecomment-2863900055
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      FFRUNNER_VERSION: ${{ needs.build-ffrunner.outputs.version }}
      TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true
      # Head of https://github.com/tauri-apps/tauri/pull/12491 (truly portable AppImage)
      TAURI_CLI_REV: 3b69f584e3a32a8607e0c2aa6543a88511085bfb
    steps:
    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm --needed \
          git \
          rustup \
          nodejs \
          npm \
          curl \
          wget \
          file \
          patchelf \
          webkit2gtk-4.1 \
          libayatana-appindicator \
          librsvg \
          xdotool \
          openssl \
          xorg-server-xvfb
        rustup default stable
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Restore Tauri CLI
      id: cache-tauri
      uses: actions/cache@v6
      with:
        path: ~/.cargo
        key: tauri-cli-experimental-${{ env.TAURI_CLI_REV }}-Linux

    - name: Install Tauri CLI
      if: steps.cache-tauri.outputs.cache-hit != 'true'
      run: cargo install tauri-cli --git https://github.com/tauri-apps/tauri --rev ${{ env.TAURI_CLI_REV }} --locked

    - uses: actions/checkout@v7

    - name: Download ffrunner
      uses: actions/download-artifact@v8.0.2
      with:
        name: ffrunner-mingw
        path: resources/ffrunner

    - name: Install NPM packages
      run: npm install

    - name: Build
      run: cargo tauri build --bundles appimage

    - name: Package
      run: |
        cd src-tauri/target/release
        mkdir linux-appimage
        cp -r -t linux-appimage bundle/appimage/OpenFusionLauncher_*.AppImage

    - uses: actions/upload-artifact@v7.0.2
      with:
        name: openfusionlauncher-linux-appimage
        path: src-tauri/target/release/linux-appimage/

  build-macos:
    needs: build-ffrunner
    runs-on: macos-latest
    env:
      FFRUNNER_VERSION: ${{ needs.build-ffrunner.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Restore Tauri CLI
        id: cache-tauri
        uses: actions/cache@v6
        with:
          path: /Users/runner/.cargo
          key: tauri-cli-MacOS
      
      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - uses: actions/checkout@v7

      - name: Download ffrunner
        uses: actions/download-artifact@v8.0.2
        with:
          name: ffrunner-mingw
          path: resources/ffrunner

      - name: Install NPM packages
        run: npm install

      - name: Ensure targets for Universal binary are present
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # .app only; the DMG is created after signing, in publish.yml.
      - name: Build
        run: cargo tauri build --bundles app --target universal-apple-darwin

      - name: Package
        run: |
          cd src-tauri/target/universal-apple-darwin/release/
          mkdir macos-universal
          mv bundle/macos/OpenFusionLauncher.app/ macos-universal

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-macos-universal
          path: src-tauri/target/universal-apple-darwin/release/macos-universal/

  build-windows:
    needs: build-ffrunner
    runs-on: windows-latest
    env:
      FFRUNNER_VERSION: ${{ needs.build-ffrunner.outputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Restore Tauri CLI
        id: cache-tauri
        uses: actions/cache@v6
        with:
          path: C:\Users\runneradmin\.cargo
          key: tauri-cli-Windows
      
      - name: Install Tauri CLI
        if: steps.cache-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - uses: actions/checkout@v7

      - name: Download ffrunner
        uses: actions/download-artifact@v8.0.2
        with:
          name: ffrunner-mingw
          path: resources/ffrunner

      - name: Install NPM packages
        run: npm install

      # - name: Restore Cargo dependencies
      #   id: cache-cargo
      #   uses: actions/cache@v6
      #   with:
      #     path: |
      #       src-tauri/target/release/deps
      #       src-tauri/target/release/.fingerprint
      #       src-tauri/target/release/incremental
      #     key: cargo-deps-Windows

      # Bundler puts an NSIS mark on the EXE; package standalone first.
      - name: Build
        run: cargo tauri build

      - name: Package standalone
        run: |
          cd src-tauri/target/release
          mkdir windows-standalone
          Copy-Item -Destination windows-standalone -Recurse -Path openfusionlauncher.exe,ffrunner.exe,ffrunner64.exe,d3d9_vulkan.dll,d3d9_vulkan64.dll,assets,defaults,loader,loader-x64,player,mono
      
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-windows-standalone
          path: src-tauri/target/release/windows-standalone/

      - name: Create installer
        run: cargo tauri bundle --bundles nsis

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: openfusionlauncher-windows-installer
          path: src-tauri/target/release/bundle/nsis/
