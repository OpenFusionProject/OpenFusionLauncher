[package]
name = "openfusionlauncher"
version = "2.2.4"
description = "OpenFusionLauncher"
authors = ["OpenFusion Contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "scamper"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2.8.0"
uuid = { version = "1.23.2", features = ["serde", "v4"] }
dns-lookup = "2.1.1"
tokio = { version =  "1.52.3", features = ["sync"] }
reqwest = { version = "0.12.28", features = ["json"] }
ffbuildtool = { git = "https://github.com/OpenFusionProject/ffbuildtool.git", tag = "v5.1.0", default-features = false }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.4.0"
regex = "1.12.3"
rust-proxy = { git = "https://github.com/yungcomputerchair/rust-proxy.git", rev = "44a8f46090846c03ca5bb77081b13b3937bd7c9b", features = ["upgrade"] }
which = "8.0.2"
protontools = "1.1.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
